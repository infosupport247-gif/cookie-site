<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e7c1"/>
      <stop offset="30%" stop-color="#f0d99a"/>
      <stop offset="60%" stop-color="#c9a55c"/>
      <stop offset="100%" stop-color="#8a6e2f"/>
    </linearGradient>
    <linearGradient id="goldLeafShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c896"/>
      <stop offset="50%" stop-color="#a8823f"/>
      <stop offset="100%" stop-color="#6b5222"/>
    </linearGradient>
  </defs>

  <!-- Smaller left leaf, curving upper-left -->
  <path d="M60 90
           C 45 80, 28 68, 20 50
           C 14 36, 16 22, 24 10
           C 30 22, 34 34, 38 46
           C 42 58, 50 72, 60 90 Z"
        fill="url(#goldLeafShadow)" opacity="0.95"/>
  <!-- veins for small leaf -->
  <path d="M24 10 C 26 26, 32 46, 60 90" stroke="#f6e7c1" stroke-width="0.6" opacity="0.5" fill="none"/>
  <path d="M22 24 C 30 34, 40 50, 52 68" stroke="#f6e7c1" stroke-width="0.4" opacity="0.35" fill="none"/>
  <path d="M18 40 C 28 48, 40 62, 55 80" stroke="#f6e7c1" stroke-width="0.4" opacity="0.3" fill="none"/>

  <!-- Larger right leaf, curving upper-right -->
  <path d="M60 90
           C 68 72, 78 54, 86 36
           C 92 22, 96 10, 98 2
           C 104 14, 108 28, 106 44
           C 104 60, 92 76, 60 90 Z"
        fill="url(#goldLeaf)"/>
  <!-- veins for large leaf -->
  <path d="M98 2 C 92 22, 78 54, 60 90" stroke="#fffbe6" stroke-width="0.7" opacity="0.55" fill="none"/>
  <path d="M100 14 C 90 32, 74 58, 62 80" stroke="#fffbe6" stroke-width="0.5" opacity="0.4" fill="none"/>
  <path d="M102 28 C 90 44, 76 62, 64 78" stroke="#fffbe6" stroke-width="0.5" opacity="0.35" fill="none"/>
  <path d="M104 40 C 92 52, 80 64, 68 76" stroke="#fffbe6" stroke-width="0.4" opacity="0.3" fill="none"/>

  <!-- central stem point -->
  <path d="M58 92 C 58 88, 59 86, 60 84 C 61 86, 62 88, 62 92 Z" fill="url(#goldLeafShadow)"/>
</svg>
